<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ComDraft">
  <title>ComDraft</title>
  <!-- Cùng họ với con dấu tròn "Je m'appelle Huong · Lecturer & Researcher":
       đĩa tròn màu san hô, vành sáng mảnh bên trong, giữa là trang văn bản
       gấp góc — chữ viết ra giấy, đúng nghĩa soạn thảo văn bản.
       © Đỗ Thùy Hương, 2026. -->
  <defs>
    <linearGradient id="cd-dia" x1="10" y1="6" x2="54" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFA095"/>
      <stop offset=".5" stop-color="#DC756A"/>
      <stop offset="1" stop-color="#B54B39"/>
    </linearGradient>
    <linearGradient id="cd-to" x1="20" y1="14" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDFC"/>
      <stop offset="1" stop-color="#F3DED4"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#cd-dia)"/>
  <circle cx="32" cy="32" r="26.6" fill="none" stroke="#FFFFFF" stroke-opacity=".42" stroke-width="1.7"/>

  <!-- trang giấy, góc trên bên phải gấp lại -->
  <path d="M22 15h13.4L45 24.4V47a2.6 2.6 0 0 1-2.6 2.6H22A2.6 2.6 0 0 1 19.4 47V17.6A2.6 2.6 0 0 1 22 15Z"
        fill="#8E3A28" fill-opacity=".26" transform="translate(0 1.5)"/>
  <path d="M22 15h13.4L45 24.4V47a2.6 2.6 0 0 1-2.6 2.6H22A2.6 2.6 0 0 1 19.4 47V17.6A2.6 2.6 0 0 1 22 15Z"
        fill="url(#cd-to)"/>
  <path d="M35.4 15 45 24.4h-7a2.6 2.6 0 0 1-2.6-2.6V15Z" fill="#E4C3B6"/>

  <rect x="24" y="28.4" width="9.6" height="3.2" rx="1.6" fill="#C05340"/>
  <rect x="24" y="35" width="16" height="2.7" rx="1.35" fill="#DC756A" fill-opacity=".62"/>
  <rect x="24" y="40.6" width="12.4" height="2.7" rx="1.35" fill="#DC756A" fill-opacity=".62"/>
</svg>
