<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ComDraft">
  <title>ComDraft</title>
  <!-- Dấu gọn: chỉ hai chữ C và D lồng nhau, không đốm trang trí — ứng dụng
       dùng ở 46 px và 32 px, thêm chi tiết vào là thành lấm tấm.
       Sinh bởi scripts/ve_logo.py — đừng sửa tay.
       © Đỗ Thùy Hương, 2026. -->
  <defs>
    <linearGradient id="san" x1="14" y1="16" x2="46" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EFA095"/>
      <stop offset=".55" stop-color="#DC756A"/>
      <stop offset="1" stop-color="#B54B39"/>
    </linearGradient>
    <linearGradient id="kem" x1="30" y1="16" x2="52" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0DFC6"/>
      <stop offset=".6" stop-color="#D6B78F"/>
      <stop offset="1" stop-color="#AE8B5E"/>
    </linearGradient>
    <filter id="khoi" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1.1" stdDeviation="1.1" flood-color="#8E3A28" flood-opacity=".30"/>
    </filter>
  </defs>
  <g filter="url(#khoi)">
    <path d="M 29.86 22.70 A 11.80 11.80 0 1 0 29.86 41.30" fill="none" stroke-width="6.6" stroke-linecap="round" stroke="url(#san)"/>
    <path d="M 33.80 43.40 L 33.80 20.60 C 45.77 20.60 51.40 25.39 51.40 32.00 C 51.40 38.61 45.77 43.40 33.80 43.40 Z" fill="none" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round" stroke="url(#kem)"/>
    <path d="M 26.25 20.78 A 11.8 11.8 0 0 1 32.38 25.40"
          fill="none" stroke-width="6.6" stroke-linecap="round" stroke="url(#san)"/>
  </g>
  <path d="M 29.86 22.70 A 11.80 11.80 0 1 0 29.86 41.30" fill="none" stroke="#F0DFC6" stroke-opacity=".34"
        stroke-width="1.5" stroke-linecap="round" transform="translate(-1.0,-1.2)"/>
</svg>
